# SearXNG-konfig for Nordavind. Bygger på standardoppsettet; kun avvikene
# står her. VIKTIG: `json` i formats — uten den svarer API-et 403, som er
# den vanligste feilkilden ved oppsett.
use_default_settings: true

server:
  # Byttes av setup.sh ved installasjon (sed) — aldri sjekk inn ekte nøkkel.
  secret_key: "CHANGE_ME_AT_SETUP"
  limiter: false # kun loopback-trafikk fra egen backend — limiter gir bare falske avslag

search:
  formats:
    - html
    - json # backendens API-kontrakt (searxng.go)
  safe_search: 1

valkey:
  url: valkey://valkey:6379/0

# Motorvalg er MÅLT, ikke antatt (12-søks stabilitetstest 2026-07-27):
# google cse 12/12, startpage 12/12, mojeek 8/12 — disse bærer.
# brave 0/12 og duckduckgo 0/12 blokkerer datasenter-IP-en nesten per
# forespørsel («too many requests»/CAPTCHA) og er ren støy — fjernet.
# NB: den tidligere Google-nedvektingen var feil; google cse er MEST stabil.
# wikipedia beholdes som spesialkilde for rene oppslag (blokkeres ikke).
engines:
  - name: google
    weight: 1.3
    disabled: false
  - name: startpage
    weight: 1.2
    disabled: false
  - name: mojeek
    weight: 1.0
    disabled: false
  - name: wikipedia
    weight: 1.0
    disabled: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
