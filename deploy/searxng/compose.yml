# SearXNG: self-hostet metasøk for Nordavind-backenden. Loopback-only —
# UFW slipper uansett bare 22/80/443, og backend når den på 127.0.0.1:8888.
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      # Hele katalogen — imagets entrypoint gjør sed -i og trenger å eie den.
      - ./config:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    depends_on:
      - valkey
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save "" --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
